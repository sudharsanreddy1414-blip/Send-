button,a.wa{border:0;border-radius:18px;padding:7px 10px;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;text-decoration:none;font-family:inherit}
.bg,.bh{background:var(--card);color:var(--mut);border:1px solid var(--line)}
.bg.on{background:var(--g);color:#fff;border-color:var(--g)}.bh.on{background:var(--h);color:#fff;border-color:var(--h)}
button:disabled{opacity:.45;cursor:not-allowed}
a.wa{background:var(--wa);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.tools button{background:var(--card);color:var(--fg);border:1px solid var(--line);padding:9px 12px}
.empty{color:var(--mut);text-align:center;padding:24px}
</style>

 if(!window.claude||!claude.use){setSync("Shared attendance needs this page opened from its claude.ai link. Marking is disabled here.",true);return;}
 db=await claude.use("db");
 if(!db){setSync("Couldn't connect to shared attendance (sign in to claude.ai). Marking is disabled.",true);return;}
 const user=await claude.use("user");
 const w=user?await user.can("data.write"):null;
 canWrite=w!==false;
 if(user&&user.canEdit&&await user.canEdit())$("reset").hidden=false;
 db.collection("att").onSnapshot(snap=>{st={};snap.docs.forEach(d=>{if(d.exists)st[d.id]=d.data();});
   setSync(canWrite?"✓ Live — everyone with this link sees the same attendance.":"✓ Live (view only) — ask the owner for Contributor access to mark.",!canWrite);render();},
  err=>setSync("Live updates stopped ("+err.code+"). Reload the page.",true));
})();
</script>
